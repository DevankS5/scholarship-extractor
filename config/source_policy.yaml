# Source registry & trust policy.
# `reviewed: true` means a human confirmed the domain is controlled by the provider.
# Domains below were selected from each provider's well-known public web presence; a reviewer
# MUST re-confirm them (and robots.txt / terms) before relying on the output. Set reviewed: false
# to downgrade a source to PRIMARY_LIKELY (=> records can never be VERIFIED).
#
# Fixture sources (is_fixture: true) use the fixture:// scheme and are SIMULATED providers used only
# for tests/demos (change detection, stale handling). They are labelled FIXTURE everywhere in the UI
# and are never counted as real records.
sources:
  # ---------------- Real sources ----------------
  - key: nsp
    name: National Scholarship Portal
    provider_name: National Scholarship Portal
    provider_aliases: ["National Scholarship Portal", "NSP", "Government of India"]
    source_type: GOVERNMENT_PORTAL
    authority_level: PRIMARY
    homepage: https://scholarships.gov.in/
    official_domains: [scholarships.gov.in]
    application_domains: [scholarships.gov.in]
    seed_urls: ["https://scholarships.gov.in/"]
    max_depth: 2
    request_delay_seconds: 2.5
    enabled: true
    reviewed: true
    reviewed_on: "2026-01-15"
    rationale: "Government of India's central scholarship portal (gov.in domain; referenced by ministries' own scheme pages)."

